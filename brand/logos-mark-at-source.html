<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff;display:flex;gap:40px;padding:40px;font-family:"Bricolage Grotesque",sans-serif}
  .tile{width:400px;height:400px;background:#15201d;display:grid;place-items:center;overflow:hidden}
  .row{display:flex;align-items:center}
  .s{font-weight:800;color:#fff;line-height:1;letter-spacing:-0.04em;font-size:230px}
  .cube{width:200px;height:200px;margin-right:6px;margin-top:8px;display:block}
  text{font-family:"Bricolage Grotesque",sans-serif}
</style></head><body>

<!-- A: @ projected onto the left face, centred in it -->
<div class="tile"><div class="row">
  <svg class="cube" viewBox="0 0 100 100" fill="none" stroke="#4fc39e" stroke-width="7" stroke-linejoin="round">
    <path d="M50 6 L92 28 L92 72 L50 94 L8 72 L8 28 Z"/>
    <path d="M8 28 L50 50 L92 28 M50 50 L50 94"/>
    <text x="29" y="71.5" text-anchor="middle" font-weight="400" font-size="29" fill="#4fc39e" stroke="none" transform="matrix(1 0.524 0 1 0 -15.2)">@</text>
  </svg>
  <span class="s">S</span>
</div></div>

<!-- B: @ upright, centred in the left face -->
<div class="tile"><div class="row">
  <svg class="cube" viewBox="0 0 100 100" fill="none" stroke="#4fc39e" stroke-width="7" stroke-linejoin="round">
    <path d="M50 6 L92 28 L92 72 L50 94 L8 72 L8 28 Z"/>
    <path d="M8 28 L50 50 L92 28 M50 50 L50 94"/>
    <text x="29" y="70.5" text-anchor="middle" font-weight="400" font-size="26" fill="#4fc39e" stroke="none">@</text>
  </svg>
  <span class="s">S</span>
</div></div>

</body></html>
