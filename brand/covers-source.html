<!DOCTYPE html><html><head><meta charset="utf-8">

<style>
  body{margin:0;background:#fff;display:grid;gap:30px;padding:30px;font-family:"DM Sans",sans-serif}
  .cover{width:1128px;height:191px;background:#15201d;position:relative;overflow:hidden;color:#fff}

  /* 1: pipeline — wireframe cube → layered cube → solid cube */

  .c1 .steps svg{width:110px;height:110px}

  /* 3: layer lines — a printed contour landscape */
  /* 4: photo strip */
  .c4 .strip{position:absolute;left:120px;top:0;height:191px;display:flex}
  .c4 .strip img{height:191px;width:150px;object-fit:cover;filter:saturate(.85) brightness(.85)}
  .c4 .fade{position:absolute;left:120px;top:0;width:120px;height:191px;background:linear-gradient(90deg,#15201d,transparent)}
  .c4 .fade2{position:absolute;left:560px;top:0;width:170px;height:191px;background:linear-gradient(90deg,transparent,#15201d 70%)}
